# PesaJamaa static site — Nginx server block.
# Installed by deploy/setup-vps.sh to /etc/nginx/sites-available/pesajamaa.conf.
# After installing, run certbot (the setup script does this) to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name pesajamaa.co.tz www.pesajamaa.co.tz;

    root /var/www/pesajamaa;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/pesajamaa-security-headers.conf;

    # Immutable, content-hashed Astro assets.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/pesajamaa-security-headers.conf;
        try_files $uri =404;
    }

    # Static media — cache for 30 days.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/pesajamaa-security-headers.conf;
        try_files $uri =404;
    }

    # HTML should always be revalidated so new deploys go live immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pesajamaa-security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # HSTS is added automatically by certbot --nginx after HTTPS is enabled.
}
